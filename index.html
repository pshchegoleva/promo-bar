<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Промокод для бара</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      max-width: 420px;
      margin: 20px auto;
      padding: 15px;
    }
    h3 {
      text-align: center;
      margin-bottom: 20px;
      text-transform: uppercase; /* Делает буквы заглавными */
      letter-spacing: 1px;       /* Чуть раздвигает буквы — выглядит аккуратнее */
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 14px;
      /* Фирменный цвет D1894B */
      background-color: #D1894B;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover {
      background-color: #b8773f; /* Чуть темнее при наведении — приятный эффект */
    }
    button:disabled {
      background-color: #aaa;
    }
    #result {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
      min-height: 24px;
    }
    .ok { color: #28a745; }
    .error { color: #dc3545; }
  </style>
</head>
<body>
  <!-- Заголовок заглавными буквами -->
  <h3>ИПА крафтовый бар</h3>

  <input type="text" id="promoInput" placeholder="Вписывай только заглавными буквами" />
  <button id="activateBtn">Активировать</button>
  <div id="result"></div>

  <!-- Подключаем VK Bridge -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/vk-bridge.js"></script>
  <script>
    // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT (должна заканчиваться на /exec)
    const apiUrl = 'https://script.google.com/macros/s/AKfycbwy7bKQ8dB1S0MWGR_dj6kkD5rydZxnZMOt-5I07UIDNShuumWf6ALnkPYH4vtaRF2SGA/exec';

    document.getElementById('activateBtn').addEventListener('click', async () => {
      const btn = document.getElementById('activateBtn');
      const resultDiv = document.getElementById('result');
      btn.disabled = true;
      resultDiv.className = '';
      resultDiv.textContent = 'Проверка...';

      const code = document.getElementById('promoInput').value.trim().toUpperCase();
      if (!code) {
        resultDiv.className = 'error';
        resultDiv.textContent = 'Введите промокод';
        btn.disabled = false;
        return;
      }

      let vkId;
      try {
        const user = await VK.Bridge.send('VKWebAppGetUserInfo');
        vkId = user.id;
      } catch (e) {
        resultDiv.className = 'error';
        resultDiv.textContent = 'Ошибка: откройте страницу внутри VK (через Mini App).';
        btn.disabled = false;
        return;
      }

      try {
        const url = new URL(apiUrl);
        url.searchParams.set('code', code);
        url.searchParams.set('vk_id', vkId);

        const res = await fetch(url.toString());
        const data = await res.json();

        if (data.status === 'ok') {
          resultDiv.className = 'ok';
          if (data.promoType === 'discount_15') {
            resultDiv.textContent = 'Промокод принят! Покажите это администратору — скидка −15% на все блюда.';
          } else if (data.promoType === 'free_glass') {
            resultDiv.textContent = 'Промокод принят! Покажите это администратору — второй бокал крафта в подарок.';
          } else {
            resultDiv.textContent = data.message || 'Промокод принят.';
          }
        } else {
          resultDiv.className = 'error';
          resultDiv.textContent = data.message || 'Ошибка активации';
        }
      } catch (e) {
        console.error(e);
        resultDiv.className = 'error';
        resultDiv.textContent = 'Ошибка соединения. Попробуйте позже.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
