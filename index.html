<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Промокод для бара</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      max-width: 420px;
      margin: 20px auto;
      padding: 15px;
    }
    h3 {
      text-align: center;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #D1894B;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover:not(:disabled) {
      background-color: #b8773f;
    }
    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }
    #result {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
      min-height: 24px;
    }
    .ok { color: #28a745; }
    .error { color: #dc3545; }
    #status-loading {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h3>ИПА крафтовый бар</h3>

  <!-- Статус загрузки (показываем, пока VK не инициализируется) -->
  <div id="status-loading">Инициализация приложения...</div>

  <input type="text" id="promoInput" placeholder="Вписывай только заглавными буквами" />
  <button id="activateBtn" disabled>Активировать</button>
  <div id="result"></div>

  <!-- Подключаем VK Bridge -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/vk-bridge.js"></script>
  <script>
    // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT (должна заканчиваться на /exec)
    const apiUrl = 'https://script.google.com/macros/s/AKfycbwy7bKQ8dB1S0MWGR_dj6kkD5rydZxnZMOt-5I07UIDNShuumWf6ALnkPYH4vtaRF2SGA/exec';

    // 1. СООБЩАЕМ VK, ЧТО ПРИЛОЖЕНИЕ ГОТОВО К РАБОТЕ
    VK.Bridge.send('VKWebAppInit');

    // 2. ЖДЁМ ПОДТВЕРЖДЕНИЯ ОТ VK
    VK.Bridge.subscribe((e) => {
      if (e.detail.type === 'VKWebAppInitResult') {
        // Приложение успешно инициализировано!
        document.getElementById('status-loading').style.display = 'none';
        document.getElementById('activateBtn').disabled = false;
        console.log('VK App initialized successfully');
      }
    });

    // 3. ОБРАБОТЧИК КНОПКИ
    document.getElementById('activateBtn').addEventListener('click', async () => {
      const btn = document.getElementById('activateBtn');
      const resultDiv = document.getElementById('result');
      
      btn.disabled = true;
      resultDiv.className = '';
      resultDiv.textContent = 'Проверка...';

      const code = document.getElementById('promoInput').value.trim().toUpperCase();
      if (!code) {
        showResult('Введите промокод', true);
        btn.disabled = false;
        return;
      }

      let vkId;
      try {
        // Получаем ID пользователя только после инициализации
        const user = await VK.Bridge.send('VKWebAppGetUserInfo');
        vkId = user.id;
      } catch (e) {
        console.error('Error getting user info:', e);
        showResult('Ошибка: откройте страницу внутри VK (через Mini App).', true);
        btn.disabled = false;
        return;
      }

      try {
        const url = new URL(apiUrl);
        url.searchParams.set('code', code);
        url.searchParams.set('vk_id', vkId);

        const res = await fetch(url.toString());
        const data = await res.json();

        if (data.status === 'ok') {
          if (data.promoType === 'discount_15') {
            showResult('Промокод принят! Скидка −15% на все блюда.', false);
          } else if (data.promoType === 'free_glass') {
            showResult('Промокод принят! Второй бокал крафта в подарок.', false);
          } else {
            showResult(data.message || 'Промокод принят.', false);
          }
        } else {
          showResult(data.message || 'Ошибка активации промокода', true);
        }
      } catch (e) {
        console.error(e);
        showResult('Ошибка соединения. Попробуйте позже.', true);
      } finally {
        btn.disabled = false;
      }
    });

    // Вспомогательная функция для вывода результата
    function showResult(message, isError) {
      const resultDiv = document.getElementById('result');
      resultDiv.className = isError ? 'error' : 'ok';
      resultDiv.textContent = message;
    }
  </script>
</body>
</html>
